name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - run: chmod +x gradlew
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Build APK
        run: ./gradlew assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk FlipTimer.apk
      - uses: actions/upload-artifact@v5
        with:
          name: FlipTimer-apk
          path: FlipTimer.apk
      # Each build on main becomes a Release with the APK attached, so it can be installed straight from a phone.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Flip Timer build ${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: FlipTimer.apk
          make_latest: true
